AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Prism - AI-powered event photo gallery

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        ROOMS_TABLE: !Ref EventRoomsTable
        PHOTOS_TABLE: !Ref RoomPhotosTable
        SESSIONS_TABLE: !Ref GuestSessionsTable
        REKOGNITION_COLLECTION: eventsnap-faces
        BUCKET_NAME: !Ref UploadBucketName
        GUEST_JWT_SECRET: !Ref GuestJwtSecret

Parameters:
  GuestJwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign and verify guest JWTs
  UploadBucketName:
    Type: String
    Default: eventsnap-uploads-anwesh2712
    Description: >
      Name of the existing S3 bucket used for direct photo uploads.
      This bucket is provisioned outside of this stack (see PROJECT_GUIDE.md);
      override this parameter at deploy time if the bucket name changes
      or the stack is deployed under a different account/environment.
  FrontendUrl:
    Type: String
    Default: http://localhost:5173
    Description: >
      Origin of the deployed frontend (e.g. the Amplify app URL, no trailing
      slash). Used for API Gateway CORS and as the Cognito OAuth callback/
      logout URL, since the frontend's redirect_uri resolves to
      window.location.origin at runtime. Override at deploy time once the
      Amplify domain (or custom domain) is known.

Resources:

  # ============================================
  # 1. DYNAMODB TABLES
  # ============================================
  EventRoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: hostId
          AttributeType: S
        - AttributeName: expiryDate
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: hostId-index
          KeySchema:
            - AttributeName: hostId
              KeyType: HASH
            - AttributeName: expiryDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RoomPhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: faceId
          AttributeType: S
        - AttributeName: roomId
          AttributeType: S
        - AttributeName: hash
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: faceId-index
          KeySchema:
            - AttributeName: faceId
              KeyType: HASH
            - AttributeName: roomId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: hash-index
          KeySchema:
            - AttributeName: hash
              KeyType: HASH
            - AttributeName: roomId
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  GuestSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ============================================
  # 2. COGNITO USER POOL (Host Auth)
  # ============================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: Prism-Hosts
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: prism-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - phone
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - !Ref FrontendUrl
      LogoutURLs:
        - !Ref FrontendUrl
      SupportedIdentityProviders:
        - COGNITO

  # NOTE: CognitoUserPoolDomain (prism-auth-098139608966) was created manually
  # and is already attached to this pool. Managed outside CloudFormation.

  # ============================================
  # 3. GUEST AUTHORIZER
  # ============================================
  GuestAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: authorizers.guest_authorizer.lambda_handler
      # No DynamoDB policy here — the authorizer only verifies the JWT
      # signature/expiry, it never queries DynamoDB. (The previous
      # DynamoDBReadPolicy on EventRoomsTable was unused dead permission.)

  # ============================================
  # 4. API GATEWAY
  # ============================================
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${FrontendUrl}'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
          GuestAuthorizer:
            FunctionArn: !GetAtt GuestAuthorizerFunction.Arn
            Identity:
              Headers:
                - Authorization
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
      # Method-level throttling for the room-code exchange. This is on top
      # of (not instead of) the per-room lockout in guest_token.py itself:
      # this limits raw request volume regardless of which room is being
      # targeted; the app-level counter locks out a specific room being
      # brute-forced. Neither alone is sufficient.
      MethodSettings:
        - ResourcePath: "/guest/token"
          HttpMethod: POST
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5

  ApiGatewayUnauthorizedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendUrl}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  ApiGatewayAccessDeniedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: ACCESS_DENIED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendUrl}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # ============================================
  # 5. LAMBDA FUNCTIONS
  # All use CodeUri: backend/ so utils/ is included in the package
  # ============================================

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.upload_url.lambda_handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucketName
        - DynamoDBReadPolicy:
            TableName: !Ref RoomPhotosTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /guest/upload-url
            Method: POST
            Auth:
              Authorizer: GuestAuthorizer

  IndexFacesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.index_faces.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:IndexFaces
                - rekognition:DeleteFaces
              Resource: !Sub "arn:aws:rekognition:${AWS::Region}:${AWS::AccountId}:collection/eventsnap-faces"
        - DynamoDBWritePolicy:
            TableName: !Ref RoomPhotosTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventRoomsTable
        - S3ReadPolicy:
            BucketName: !Ref UploadBucketName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt EventRoomsTable.Arn

  IndexFacesS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt IndexFacesFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${UploadBucketName}"
      SourceAccount: !Ref AWS::AccountId

  S3NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: custom_resources.s3_notification.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutBucketNotification
                - s3:GetBucketNotification
              Resource: !Sub "arn:aws:s3:::${UploadBucketName}"

  S3NotificationSetup:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: IndexFacesS3Permission
    Properties:
      ServiceToken: !GetAtt S3NotificationFunction.Arn
      BucketName: !Ref UploadBucketName
      LambdaArn: !GetAtt IndexFacesFunction.Arn

  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.search.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:SearchFacesByImage
              Resource: !Sub "arn:aws:rekognition:${AWS::Region}:${AWS::AccountId}:collection/eventsnap-faces"
            # Note: rekognition:DetectFaces was previously granted here with
            # Resource: "*" but the handler never calls DetectFaces —
            # removed as unused permission.
        - DynamoDBReadPolicy:
            TableName: !Ref RoomPhotosTable
        - S3ReadPolicy:
            BucketName: !Ref UploadBucketName
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /guest/search
            Method: POST
            Auth:
              Authorizer: GuestAuthorizer

  RoomManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.room_manager.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRoomsTable
        # FIX: this was missing entirely. _get_room_photos queries
        # RoomPhotosTable, and the delete-room/delete-photo paths below now
        # also write to it — without this, every one of those calls threw
        # AccessDeniedException, which the handler's generic except block
        # turned into the "Failed to fetch room photos." 500 error.
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomPhotosTable
        # Needed for: generating presigned GET URLs to actually resolve
        # (S3 re-checks the signing principal's IAM permissions at fetch
        # time, not at signing time), plus the cascading delete paths
        # deleting S3 objects directly.
        - S3CrudPolicy:
            BucketName: !Ref UploadBucketName
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DeleteFaces
              Resource: !Sub "arn:aws:rekognition:${AWS::Region}:${AWS::AccountId}:collection/eventsnap-faces"
      Events:
        ApiRoomsGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /rooms
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        ApiRoomsPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /rooms
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ApiRoomsByIdGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /rooms/{roomId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        ApiRoomsPhotosGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /rooms/{roomId}/photos
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        # NEW: single-photo delete, so hosts (and you) never need to
        # delete photo data directly from the AWS console again — this
        # endpoint keeps photoCount, S3, and Rekognition all in sync.
        ApiRoomsPhotoDelete:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /rooms/{roomId}/photos/{photoId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
        ApiRoomsByIdPut:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /rooms/{roomId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        ApiRoomsByIdDelete:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /rooms/{roomId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  GuestTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.guest_token.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventRoomsTable
        # NEW: needed for the per-room rate-limit counter in
        # guest_token.py, which reads/writes/deletes THROTTLE# items in
        # this table.
        - DynamoDBCrudPolicy:
            TableName: !Ref GuestSessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /guest/token
            Method: POST
            Auth:
              Authorizer: NONE

  CleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.cleanup.lambda_handler
      Policies:
        - S3FullAccessPolicy:
            BucketName: !Ref UploadBucketName
        - DynamoDBReadPolicy:
            TableName: !Ref EventRoomsTable
        - DynamoDBWritePolicy:
            TableName: !Ref RoomPhotosTable
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DeleteFaces
              Resource: !Sub "arn:aws:rekognition:${AWS::Region}:${AWS::AccountId}:collection/eventsnap-faces"
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

Outputs:
  ApiGatewayUrl:
    Description: Base URL for the API
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Description: App Client ID for Frontend
    Value: !Ref CognitoUserPoolClient
  UploadBucket:
    Description: S3 Bucket for uploads
    Value: !Ref UploadBucketName